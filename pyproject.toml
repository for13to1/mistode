[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mistode"
version = "0.1.3"
description = "Python and C code obfuscation tool"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "for13to1", email = "for13to1@outlook.com" }
]
keywords = ["obfuscation", "security", "code", "python", "c"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/for13to1/mistode"
"Bug Reports" = "https://github.com/for13to1/mistode/issues"
"Source" = "https://github.com/for13to1/mistode"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.16.3",
]

test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
# Keep the formatter from rewriting `except (A, B):` into the
# Python 3.14-only bare form (PEP 758). Runtime support is still
# governed by requires-python above.
target-version = "py313"

[tool.ruff.lint]
# `B` (bugbear), `A` (builtins shadowing) and `RUF100` (stale noqa) are clean
# and cheap to keep clean; the rest of the bugbear-adjacent rules would each
# need a separate cleanup pass.
#
# Deliberately not enabled:
# - TRY003: it flags long inline error messages, but detailed diagnostics are
#   a design goal here (every failure says what went wrong and what to do).
# - RUF001/002/003: they flag the Cyrillic lookalikes in `core.py`, which are
#   functional data for homograph detection, not typos.
select = ["E", "F", "W", "I", "C90", "B", "A", "RUF100"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E501", "W291", "W293"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[project.scripts]
mistode = "mistode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mistode"]

## Mistode Configuration Example
## Disable comments below to enable custom default values
# [tool.mistode]
# style = "random"      # Use random style instead of default similar
# length = 20           # Use 20 character length instead of default 16
# stats = true          # Always show statistics
# seed = 42             # Optional: Fixed random seed
